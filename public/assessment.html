          ${renderStep()}

    function renderProgressIndicator() {

        <div class="flex items-center gap-2">
          ${steps.map((step, i) => `
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-medium ${
              i <= currentIndex ? 'bg-orange-500 text-white' : 'bg-stone-700 text-stone-400'
            }">${i + 1}</div>
            ${i < steps.length - 1 ? `<div class="w-8 h-0.5 ${i < currentIndex ? 'bg-orange-500' : 'bg-stone-700'}"></div>` : ''}
          `).join('')}
        </div>
      `;
    }

    function renderStep() {
      switch (state.currentStep) {
        case 'welcome': return renderWelcome();
        case 'profile': return renderProfile();
        case 'objectives': return renderObjectives();
        case 'assessment': return renderAssessment();
        case 'results': return renderResults();

    // Helper functions
    function calculateOverallScore() {
      const values = Object.values(state.scores);
      if (values.length === 0) return 0;
      return Math.round((values.reduce((a, b) => a + b, 0) / values.length) * 20);
    }

    function getGaps() {
      // Dynamic target based on objective
      const targetByGoal = { 
        'exploring': 3,  // Intermediate
        'support': 3,    // Intermediate  
        'job': 4,        // Proficient
        'pmp': 5,        // Expert
        'improve': 4     // Proficient (focus on gaps)
      };
      const target = targetByGoal[state.objectives.goal] || 4;
      
      return SKILL_AREAS
        .map(skill => ({ ...skill, current: state.scores[skill.id] || 0, target, gap: target - (state.scores[skill.id] || 0) }))
        .filter(s => s.gap > 0)
        .sort((a, b) => b.gap - a.gap);
    }

    function generateRoadmap(gaps, timeline, learningStyle) {
      const weeks = parseInt(timeline);
      const steps = [];
      let totalHours = 0;
      let courseCount = 0, simCount = 0, toolCount = 0;

      // Calculate phases
      const phases = [
        { name: 'Foundation', weeks: `1-${Math.floor(weeks * 0.25)}`, color: 'bg-emerald-500' },
        { name: 'Core Skills', weeks: `${Math.floor(weeks * 0.25) + 1}-${Math.floor(weeks * 0.5)}`, color: 'bg-blue-500' },
        { name: 'Advanced', weeks: `${Math.floor(weeks * 0.5) + 1}-${Math.floor(weeks * 0.75)}`, color: 'bg-purple-500' },
        { name: 'Mastery', weeks: `${Math.floor(weeks * 0.75) + 1}-${weeks}`, color: 'bg-orange-500' }
      ];

      // Badge styles
      const typeBadges = {
        'WATCH': 'bg-blue-100 text-blue-700',
        'COURSE': 'bg-emerald-100 text-emerald-700',
        'TOOL': 'bg-cyan-100 text-cyan-700',
        'SIMULATE': 'bg-purple-100 text-purple-700',
        'APPLY': 'bg-amber-100 text-amber-700',
        'ASSESS': 'bg-rose-100 text-rose-700'
      };

      const skillBadges = {
        'basics': 'bg-stone-800 text-stone-400',
        'agile': 'bg-blue-50 text-blue-600',
        'product': 'bg-green-50 text-green-600',
        'initiation': 'bg-emerald-50 text-emerald-600',
        'scope': 'bg-teal-50 text-teal-600',
        'time': 'bg-cyan-50 text-cyan-600',
        'cost': 'bg-amber-50 text-amber-600',
        'quality': 'bg-lime-50 text-lime-600',
        'resources': 'bg-orange-50 text-orange-600',
        'communication': 'bg-pink-50 text-pink-600',
        'risk': 'bg-red-50 text-red-600',
        'procurement': 'bg-violet-50 text-violet-600',
        'softskills': 'bg-fuchsia-50 text-fuchsia-600'
      };

      // Generate steps based on gaps
      let currentWeek = 1;
      const weeksPerGap = Math.max(1, Math.floor(weeks / Math.max(gaps.length, 1)));

      gaps.forEach((gap, gapIndex) => {
        const resources = RESOURCE_MAP[gap.id];
        if (!resources) return;

        const skillName = gap.name.split(' ')[0]; // Short name

        // Add free resource first (if learning style allows)
        if (resources.free.length > 0 && (learningStyle === 'video' || learningStyle === 'balanced')) {
          const free = resources.free[0];
          steps.push({
            type: 'WATCH',
            title: free.title,
            description: 'Free introduction to build foundational knowledge',
            platform: free.platform,
            duration: free.duration,
            week: currentWeek,
            skill: skillName,
            url: free.url || '#',
            typeBadgeClass: typeBadges['WATCH'],
            skillBadgeClass: skillBadges[gap.id] || 'bg-stone-800 text-stone-400'
          });
          totalHours += parseFloat(free.duration) / 60 || 0.5;
        }

        // Add course (if learning style allows)
        if (resources.courses.length > 0 && (learningStyle === 'video' || learningStyle === 'balanced')) {
          const course = resources.courses[0];
          steps.push({
            type: 'COURSE',
            title: course.title,
            description: 'Comprehensive training with video lessons and quizzes',
            platform: course.platform,
            duration: course.duration,
            week: currentWeek,
            skill: skillName,
            url: course.url || '#',
            typeBadgeClass: typeBadges['COURSE'],
            skillBadgeClass: skillBadges[gap.id] || 'bg-stone-800 text-stone-400'
          });
          totalHours += parseFloat(course.duration) || 2;
          courseCount++;
        }

        // Add tool (if learning style allows)
        if (resources.tools.length > 0 && (learningStyle === 'hands-on' || learningStyle === 'balanced')) {
          const tool = resources.tools[0];
          steps.push({
            type: 'TOOL',
            title: tool.title,
            description: 'Practice with professional PM tool',
            platform: tool.platform,
            duration: tool.duration,
            week: currentWeek + Math.floor(weeksPerGap / 2),
            skill: skillName,
            url: tool.url || '#',
            typeBadgeClass: typeBadges['TOOL'],
            skillBadgeClass: skillBadges[gap.id] || 'bg-stone-800 text-stone-400'
          });
          totalHours += parseFloat(tool.duration) || 1;
          toolCount++;
        }

        // Add simulation (if available and learning style allows)
        if (resources.simulations.length > 0 && (learningStyle === 'hands-on' || learningStyle === 'balanced')) {
          const sim = resources.simulations[0];
          steps.push({
            type: 'SIMULATE',
            title: sim.title,
            description: 'Apply skills in realistic scenario simulation',
            platform: sim.platform,
            duration: sim.duration,
            week: currentWeek + weeksPerGap - 1,
            skill: skillName,
            url: sim.url || '#',
            typeBadgeClass: typeBadges['SIMULATE'],
            skillBadgeClass: skillBadges[gap.id] || 'bg-stone-800 text-stone-400'
          });
          totalHours += parseFloat(sim.duration) / 60 || 1;
          simCount++;
        }

        currentWeek += weeksPerGap;
      });

      // Add final assessment step
      steps.push({
        type: 'ASSESS',
        title: 'Reassess Your Skills',
        description: 'Retake the assessment to measure your progress',
        platform: 'apexvalue.com',
        duration: '10 min',
        week: weeks,
        skill: 'All',
        url: 'https://apexvalue.com/assessment',
        typeBadgeClass: typeBadges['ASSESS'],
        skillBadgeClass: 'bg-orange-100 text-orange-600'
      });

      // Sort by week
      steps.sort((a, b) => a.week - b.week);

      return {
        phases,
        steps: steps.slice(0, 12), // Limit to 12 steps for display
        totalHours: Math.round(totalHours),
        counts: {
          courses: courseCount,
          simulations: simCount,
          tools: toolCount
        }
      };
    }

      if (state.profile.certifications.includes(cert)) {
        state.profile.certifications = state.profile.certifications.filter(c => c !== cert);

        state.profile.certifications.push(cert);
      }
      render();
    }

      state.scores[skillId] = value;

      state.expandedSkill = state.expandedSkill === skillId ? null : skillId;

            doc.setFont('helvetica', 'bold');
            doc.setTextColor(...(i === 0 ? colors.rose : colors.amber));
            doc.text(`+${gap.gap * 20}%`, pageWidth - margin, y + 4, { align: 'right' });
            
            y += 18;
          });
        } else {
          doc.setFontSize(10);
          doc.setTextColor(...colors.emerald);
          doc.text('Congratulations! You have met your target in all areas.', margin, y + 4);
        }

        // Footer
        doc.setFillColor(...colors.orange);
        doc.rect(0, pageHeight - 18, pageWidth, 18, 'F');
        doc.setFontSize(9);
        doc.setTextColor(...colors.white);
        doc.text('Generated by ApexValue PMO Advisor', margin, pageHeight - 7);
        doc.text('apexvalue.com', pageWidth - margin, pageHeight - 7, { align: 'right' });

        // ============ PAGE 2: SKILLS BREAKDOWN ============
        doc.addPage();
        
        // Header
        doc.setFillColor(...colors.dark);
        doc.rect(0, 0, pageWidth, 22, 'F');
        doc.setFontSize(14);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(...colors.white);
        doc.text('SKILLS BREAKDOWN', margin, 15);
        
        y = 35;
        
        // Skills with bars
        SKILL_AREAS.forEach((skill) => {
          const score = state.scores[skill.id] || 0;
          const percentage = score * 20;
          const barColor = score >= 4 ? colors.emerald : score >= 3 ? colors.amber : colors.rose;
          
          // Skill name
          doc.setFontSize(9);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(...colors.dark);
          doc.text(skill.name, margin, y + 3);
          
          // Background bar
          doc.setFillColor(...colors.lightGray);
          doc.roundedRect(margin + 52, y, 100, 5, 1, 1, 'F');
          
          // Progress bar
          if (percentage > 0) {
            doc.setFillColor(...barColor);
            doc.roundedRect(margin + 52, y, percentage, 5, 1, 1, 'F');
          }
          
          // Percentage
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(...barColor);
          doc.text(`${percentage}%`, pageWidth - margin, y + 3, { align: 'right' });
          
          y += 11;
        });

        // Legend
        y += 8;
        doc.setFontSize(8);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(...colors.gray);
        
        const legendItems = [
          { color: colors.emerald, label: '80-100% Proficient' },
          { color: colors.amber, label: '60-79% Intermediate' },
          { color: colors.rose, label: '0-59% Needs Work' }
        ];
        
        doc.text('Legend:', margin, y);
        legendItems.forEach((item, i) => {
          const x = margin + 18 + (i * 45);
          doc.setFillColor(...item.color);
          doc.rect(x, y - 3, 6, 4, 'F');
          doc.setTextColor(...colors.gray);
          doc.text(item.label, x + 8, y);
        });

        // Page footer
        doc.setFillColor(...colors.orange);
        doc.rect(0, pageHeight - 12, pageWidth, 12, 'F');
        doc.setFontSize(8);
        doc.setTextColor(...colors.white);
        doc.text('Page 2 of 4', pageWidth / 2, pageHeight - 5, { align: 'center' });

        // ============ PAGE 3: ROADMAP ============
        doc.addPage();
        
        // Header
        doc.setFillColor(...colors.dark);
        doc.rect(0, 0, pageWidth, 22, 'F');
        doc.setFontSize(14);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(...colors.white);
        doc.text(`YOUR ${state.objectives.timeline}-WEEK DEVELOPMENT ROADMAP`, margin, 15);
        
        y = 35;
        
        // Phase timeline
        const phaseColors = [colors.emerald, [59, 130, 246], [147, 51, 234], colors.orange];
        const phaseWidth = contentWidth / 4;
        
        roadmap.phases.forEach((phase, i) => {
          const x = margin + (i * phaseWidth);
          doc.setFillColor(...phaseColors[i]);
          doc.rect(x, y, phaseWidth - 3, 3, 'F');
          
          doc.setFontSize(8);
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(...colors.dark);
          doc.text(phase.name, x, y + 8);
          
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(...colors.gray);
          doc.text(`Weeks ${phase.weeks}`, x, y + 13);
        });
        
        y += 22;
        
        // Roadmap steps
        const typeColors = {
          'WATCH': [59, 130, 246],
          'COURSE': colors.emerald,
          'TOOL': [6, 182, 212],
          'SIMULATE': [147, 51, 234],
          'APPLY': colors.amber,
          'ASSESS': colors.orange
        };
        
        roadmap.steps.slice(0, 10).forEach((step, i) => {
          // Step number circle
          doc.setFillColor(...colors.dark);
          doc.circle(margin + 4, y + 3, 3.5, 'F');
          doc.setFontSize(7);
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(...colors.white);
          doc.text((i + 1).toString(), margin + 4, y + 4.5, { align: 'center' });
          
          // Type badge
          const badgeColor = typeColors[step.type] || colors.gray;
          doc.setFillColor(...badgeColor);
          doc.roundedRect(margin + 11, y, 16, 4.5, 1, 1, 'F');
          doc.setFontSize(6);
          doc.setTextColor(...colors.white);
          doc.text(step.type, margin + 19, y + 3.2, { align: 'center' });
          
          // Title (with clickable link using textWithLink)
          doc.setFontSize(9);
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(...colors.orange);
          const titleText = step.title;
          const titleX = margin + 30;
          const titleY = y + 3.5;
          doc.text(titleText, titleX, titleY);
          
          // Add underline to indicate it's a link
          const titleWidth = doc.getTextWidth(titleText);
          doc.setDrawColor(...colors.orange);
          doc.setLineWidth(0.2);
          doc.line(titleX, titleY + 0.5, titleX + titleWidth, titleY + 0.5);
          
          // Create clickable annotation
          doc.link(titleX, y - 1, titleWidth + 5, 7, { url: step.url });
          
          // Details
          doc.setFontSize(7);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(...colors.gray);
          doc.text(`${step.platform}  |  ${step.duration}  |  Week ${step.week}`, margin + 30, y + 9);
          
          y += 14;
        });
        
        // Summary box
        y = pageHeight - 48;
        doc.setFillColor(...colors.lightGray);
        doc.roundedRect(margin, y, contentWidth, 22, 2, 2, 'F');
        
        const roadmapSummary = [
          { label: 'Courses', value: roadmap.counts.courses, color: colors.emerald },
          { label: 'Simulations', value: roadmap.counts.simulations, color: [147, 51, 234] },
          { label: 'Tools', value: roadmap.counts.tools, color: [6, 182, 212] },
          { label: 'Total Hours', value: `~${roadmap.totalHours}`, color: colors.dark }
        ];
        
        const sumItemWidth = contentWidth / 4;
        roadmapSummary.forEach((item, i) => {
          const x = margin + (i * sumItemWidth) + (sumItemWidth / 2);
          doc.setFontSize(14);
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(...item.color);
          doc.text(item.value.toString(), x, y + 10, { align: 'center' });
          
          doc.setFontSize(7);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(...colors.gray);
          doc.text(item.label, x, y + 16, { align: 'center' });
        });

        // Page footer
        doc.setFillColor(...colors.orange);
        doc.rect(0, pageHeight - 12, pageWidth, 12, 'F');
        doc.setFontSize(8);
        doc.setTextColor(...colors.white);
        doc.text('Page 3 of 4', pageWidth / 2, pageHeight - 5, { align: 'center' });

        // ============ PAGE 4: RESOURCES ============
        doc.addPage();
        
        // Header
        doc.setFillColor(...colors.dark);
        doc.rect(0, 0, pageWidth, 22, 'F');
        doc.setFontSize(14);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(...colors.white);
        doc.text('RECOMMENDED RESOURCES', margin, 15);
        
        y = 35;
        
        // Platform sections
        const platforms = [
          {
            name: 'Training Courses',
            url: 'the-executive-producer.thinkific.com',
            fullUrl: 'https://the-executive-producer.thinkific.com',
            color: colors.emerald,
            items: ['PM Fundamentals (13 hrs)', 'Initiation & Scope Management (2 hrs)', 'Time & Cost Management (2.5 hrs)', 'Quality & Risk Management (2 hrs)', 'Communication & Soft Skills (2.5 hrs)']
          },
          {
            name: 'Business Simulations',
            url: 'simulations-six.vercel.app',
            fullUrl: 'https://simulations-six.vercel.app',
            color: [147, 51, 234],
            items: ['Project Apex: Tech Startup', 'Project Apex: Construction', 'Project Apex: R&D Innovation', 'Budget Crisis (Coming Soon)']
          },
          {
            name: 'PM Tools & Templates',
            url: 'projectmanagertool.com',
            fullUrl: 'https://projectmanagertool.com',
            color: [6, 182, 212],
            items: ['CharterPro - Project Charter', 'Risk Register - Risk Assessment', 'ROI Calculator - Investment Analysis', 'WBS Builder (Coming Soon)', 'Gantt Chart Builder (Coming Soon)']
          }
        ];
        
        platforms.forEach(platform => {
          // Platform header bar
          doc.setFillColor(...platform.color);
          doc.roundedRect(margin, y, contentWidth, 8, 1, 1, 'F');
          
          doc.setFontSize(10);
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(...colors.white);
          doc.text(platform.name, margin + 4, y + 5.5);
          
          // URL with clickable link
          doc.setFontSize(8);
          doc.setFont('helvetica', 'normal');
          const urlText = platform.url;
          const urlWidth = doc.getTextWidth(urlText);
          doc.text(urlText, pageWidth - margin - 4, y + 5.5, { align: 'right' });
          doc.link(pageWidth - margin - 4 - urlWidth, y, urlWidth, 8, { url: platform.fullUrl });
          
          y += 12;
          
          // Items
          platform.items.forEach(item => {
            doc.setFontSize(9);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(...colors.dark);
            doc.text(`•  ${item}`, margin + 4, y);
            y += 6;
          });
          
          y += 6;
        });

        // CTA box
        y = pageHeight - 55;
        doc.setFillColor(...colors.orange);
        doc.roundedRect(margin, y, contentWidth, 30, 2, 2, 'F');
        
        doc.setFontSize(12);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(...colors.white);
        doc.text('Start Your Learning Journey Today', margin + 8, y + 12);
        
        doc.setFontSize(9);
        doc.setFont('helvetica', 'normal');
        doc.text('Visit apexvalue.com to access your personalized resources and track progress.', margin + 8, y + 22);

        // Page footer
        doc.setFillColor(...colors.dark);
        doc.rect(0, pageHeight - 12, pageWidth, 12, 'F');
        doc.setFontSize(8);
        doc.setTextColor(...colors.white);
        doc.text('Page 4 of 4  |  Questions? Contact support@apexvalue.com', pageWidth / 2, pageHeight - 5, { align: 'center' });

        // Save the PDF
        const fileName = `PM_Skills_Report_${state.profile.name.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.pdf`;
        doc.save(fileName);
        
      } catch (error) {
        console.error('PDF generation error:', error);
        alert('Error generating PDF: ' + error.message);
      }
      
      btn.innerHTML = '📄 Download PDF Report';
      btn.disabled = false;
    }

    // Initialize
    render();
  </script>
</body>
</html>
